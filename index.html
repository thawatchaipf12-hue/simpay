<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimPay - ระบบสแกนเงินจำลองข้ามเครื่อง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-xl font-bold text-center text-blue-600 mb-2">SimPay - ระบบสแกนเงินจำลอง</h1>
        <p class="text-xs text-center text-gray-500 mb-6" id="shop-display-id">ร้านค้า: SHOP-999</p>
        <div class="bg-blue-600 text-white p-4 rounded-lg shadow mb-6">
            <p class="text-sm opacity-80">ยอดเงินยอดขายร้านค้า</p>
            <p class="text-3xl font-bold mt-1" id="balance-display">฿ 0.00</p>
            <button onclick="resetBalance()" class="mt-3 text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded">รีเซ็ตยอด</button>
        </div>
        <div class="border-t pt-4">
            <h2 class="text-sm font-semibold text-gray-700 mb-2">จำลองการสแกนจ่ายเงิน (ทดสอบเครื่องผู้ซื้อ)</h2>
            <div class="flex gap-2">
                <input type="number" id="pay-amount" placeholder="ระบุจำนวนเงิน" class="border p-2 rounded w-full text-sm">
                <button onclick="simulatePayment()" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">จ่ายเงิน</button>
            </div>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBHzrbwxzIeSnU8chfkHTXHRoYJXF-WpxM",
            authDomain: "simpay-project-c81fa.firebaseapp.com",
            databaseURL: "https://simpay-project-c81fa-default-rtdb.firebaseio.com",
            projectId: "simpay-project-c81fa",
            storageBucket: "simpay-project-c81fa.firebasestorage.app",
            messagingSenderId: "135422057973",
            appId: "1:135422057973:web:af275bdb1d16a82162d4bc"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const shopId = "SHOP-999";
        const balanceRef = db.ref('shops/' + shopId + '/balance');
        balanceRef.on('value', (snapshot) => {
            const currentBalance = snapshot.val() || 0;
            document.getElementById('balance-display').innerText = `฿ ${currentBalance.toFixed(2)}`;
        });
        function simulatePayment() {
            const amountInput = document.getElementById('pay-amount');
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                alert("กรุณาระบุจำนวนเงินที่ถูกต้อง");
                return;
            }
            balanceRef.transaction((currentBalance) => {
                return (currentBalance || 0) + amount;
            }, (error, committed) => {
                if (committed) {
                    alert(`โอนเงินจำนวน ฿${amount.toFixed(2)} สำเร็จ!`);
                    amountInput.value = "";
                } else if (error) {
                    alert("เกิดข้อผิดพลาด: " + error);
                }
            });
        }
        function resetBalance() {
            if (confirm("ต้องการรีเซ็ตยอดเงินเป็น 0 ใช่หรือไม่?")) {
                balanceRef.set(0);
            }
        }
    </script>
</body>
</html>
